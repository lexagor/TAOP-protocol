version: 2
updates:
  # Root npm workspace (contracts, backend, SDKs, MCP, demo).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Don't adopt brand-new releases immediately (supply-chain guard).
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Hardhat 3 is a project, not a bump: the coverage gate has no HH3 path and
      # scripts/tests need the connection API migration. Tracked in issue #33 —
      # remove these ignores when the migration lands.
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-*"
        update-types: ["version-update:semver-major"]
      # Express 5 changes routing path syntax (the SPA fallback uses app.get("*"),
      # which throws at boot once demo/dist exists) — needs a small migration.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is unresolvable with typedoc/typescript-eslint peers today.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python SDK.
  - package-ecosystem: "pip"
    directory: "/packages/python-sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # These are exact-pinned by their parents in the hash-pinned compiled
      # requirements (eth-abi -> parsimonious<0.11; pydantic -> pydantic-core==x).
      # A single-package bump is unresolvable; they move via pip-compile when the
      # parents move.
      - dependency-name: "parsimonious"
      - dependency-name: "pydantic-core"

  # Keep our GitHub Actions themselves up to date (supply-chain hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Backend/demo image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
