name: Deploy read-only demo

# Publishes the backend-free, read-only demo (apps/static-demo) to GitHub Pages.
# It reads Base Sepolia directly via @taopp/sdk — no keys, no writes.
on:
  push:
    branches: [ main ]
    paths:
      - "apps/static-demo/**"
      - "packages/sdk/**"
      - "deployments.json.example"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (static demo imports @taopp/sdk)
        run: npm run sdk:build

      - name: Build static demo
        run: npm run demo:static:build
        env:
          PAGES_BASE: /TAOP-protocol/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/static-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
