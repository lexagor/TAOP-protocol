name: Nightly

# Catches drift between pushes: live-bytecode compatibility and new advisories.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run sdk:build

      - name: Live read-only checks (Base Sepolia)
        run: npm run test:live

      - name: Verify deployments.json.example against the live chain
        run: DEPLOYMENTS_PATH=deployments.json.example npm run verify:deployment

  deps:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (report only)
        run: npm audit --audit-level=high || true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: pip-audit (report only)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e packages/python-sdk pip-audit cyclonedx-bom
          pip-audit || true
          cyclonedx-py environment -o sbom-python.json || echo "cyclonedx-py skipped"

      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-python
          path: sbom-python.json
          if-no-files-found: ignore
