name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard against tracked secrets / generated files
        run: |
          BAD=$(git ls-files | grep -E '(^deployments\.json$|^taop\.db|typechain-types/|egg-info|__pycache__|\.env$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files that must stay gitignored are tracked:"
            echo "$BAD"
            exit 1
          fi

      - name: Build contracts
        run: npm run contracts:build

      - name: Build SDK (must precede typecheck — backend + mcp import @taopp/sdk)
        run: npm run sdk:build

      - name: TypeScript typecheck (sdk, demo, backend, mcp — real, fails on error)
        run: npm run typecheck

      - name: Run contract tests (with gas report)
        run: REPORT_GAS=true npm run contracts:test

      - name: Backend API tests (vitest + supertest)
        run: npm run backend:test

      - name: Build MCP server
        run: npm run mcp:build

      - name: Build demo
        run: npm run demo:build

      - name: Build backend
        run: npm run backend:build

      - name: Python SDK tests (only when a local deployments.json exists)
        run: |
          if [ -f deployments.json ]; then
            cd packages/python-sdk && . .venv/bin/activate && python -m pytest tests/ -q
          else
            echo "skipped: no deployments.json in CI (addresses-only example is committed instead)"
          fi

      - name: Lint (if eslint configured)
        run: npm run lint || echo "no lint script or passes"

      - name: MCP smoke (dist parses as valid JS/ESM)
        run: node --check packages/mcp-server/dist/index.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run contracts:build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Slither (fail on high/medium in our contracts)
        run: npm run slither

      # Second-opinion analyzer (Cyfrin Aderyn). Non-blocking: Slither is the hard
      # gate; this surfaces additional low/informational findings as an artifact.
      - name: Aderyn (second opinion)
        run: |
          curl -sL -o /tmp/aderyn.tar.xz \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          tar -xf /tmp/aderyn.tar.xz -C /tmp
          /tmp/aderyn-x86_64-unknown-linux-gnu/aderyn . || echo "aderyn finished with findings (see artifact)"

      - name: Upload Aderyn report
        uses: actions/upload-artifact@v7
        with:
          name: aderyn-report
          path: report.md
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (tests import @taopp/sdk)
        run: npm run sdk:build

      - name: Solidity coverage
        run: npm run contracts:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: solidity-coverage
          path: coverage/
          if-no-files-found: ignore

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (OpenZeppelin for remappings)
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge tests (fuzz + invariants)
        run: forge test -vv
