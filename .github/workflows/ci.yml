name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: the CI token only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard against tracked secrets / generated files
        run: |
          BAD=$(git ls-files | grep -E '(^deployments\.json$|^taop\.db|typechain-types/|egg-info|__pycache__|\.env$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files that must stay gitignored are tracked:"
            echo "$BAD"
            exit 1
          fi

      - name: Secret scan (tracked file contents)
        run: npm run scan:secrets

      - name: Build contracts
        run: npm run contracts:build

      - name: Build SDK (must precede typecheck — backend + mcp import @taopp/sdk)
        run: npm run sdk:build

      - name: TypeScript typecheck (sdk, demo, backend, mcp — real, fails on error)
        run: npm run typecheck

      - name: Run contract tests (with gas report)
        run: REPORT_GAS=true npm run contracts:test

      - name: Backend API tests (vitest + supertest)
        run: npm run backend:test

      - name: Build MCP server
        run: npm run mcp:build

      - name: MCP integration test (stdio JSON-RPC)
        run: npm run mcp:test

      - name: Build demo
        run: npm run demo:build

      - name: Build backend
        run: npm run backend:build

      - name: Build API docs (TypeDoc)
        run: npm run docs:api

      - name: Package contents (npm pack dry-run must ship dist)
        run: |
          # Capture first: piping into `grep -q` closes the pipe and (with
          # `bash -o pipefail`) kills npm pack mid-build.
          npm pack -w @taopp/sdk --dry-run > /tmp/sdk-pack.txt 2>&1
          npm pack -w @taopp/mcp-server --dry-run > /tmp/mcp-pack.txt 2>&1
          grep -q 'dist/index.cjs' /tmp/sdk-pack.txt
          grep -q 'dist/index.js' /tmp/mcp-pack.txt

      - name: Python wheel ships the bundled ABIs
        working-directory: packages/python-sdk
        run: |
          python -m pip wheel -q --no-deps -w /tmp/wheels .
          python check_wheel.py /tmp/wheels/*.whl

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Python SDK offline tests (hash-pinned deps)
        working-directory: packages/python-sdk
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --require-hashes -r requirements-dev.txt
          python -m pip install -q --no-deps -e .
          python -m pytest tests/ -q -m "not network"

      - name: Lint (ESLint for TS, Solhint for Solidity)
        run: npm run lint && npm run lint:sol

      - name: MCP smoke (dist parses as valid JS/ESM)
        run: node --check packages/mcp-server/dist/index.js

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run contracts:build

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip install -q slither-analyzer==0.11.5

      - name: Slither (fail on high/medium in our contracts)
        run: slither . --config-file slither.config.json --fail-medium --json /tmp/slither.json

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slither-report
          path: /tmp/slither.json
          if-no-files-found: ignore

      # Second-opinion analyzer (Cyfrin Aderyn). Non-blocking: Slither is the hard
      # gate; this surfaces additional low/informational findings as an artifact.
      - name: Aderyn (second opinion)
        run: |
          curl -sL -o /tmp/aderyn.tar.xz \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  /tmp/aderyn.tar.xz" | sha256sum -c -
          tar -xf /tmp/aderyn.tar.xz -C /tmp
          /tmp/aderyn-x86_64-unknown-linux-gnu/aderyn . || echo "aderyn finished with findings (see artifact)"

      - name: Upload Aderyn report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aderyn-report
          path: report.md
          if-no-files-found: ignore

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (tests import @taopp/sdk)
        run: npm run sdk:build

      - name: Solidity coverage
        run: npm run contracts:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solidity-coverage
          path: coverage/
          if-no-files-found: ignore

  foundry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (OpenZeppelin for remappings)
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Forge tests (fuzz + invariants)
        run: forge test -vv
        env:
          # Deeper than the defaults; the suite still runs in seconds.
          FOUNDRY_FUZZ_RUNS: 2000
          FOUNDRY_INVARIANT_RUNS: 256
          FOUNDRY_INVARIANT_DEPTH: 64

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Mutation spot-check (deliberately break critical lines; tests must catch each)
        run: npm run mutation:spotcheck

  # Read-only against the live Base Sepolia deployment. Non-blocking: depends on
  # a public RPC that may rate-limit, but surfaces real-bytecode drift.
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run sdk:build

      - name: Live read-only checks (Base Sepolia)
        run: npm run test:live

      - name: Verify deployments.json.example against the live chain
        run: DEPLOYMENTS_PATH=deployments.json.example npm run verify:deployment

  # Full local stack: Hardhat node + contracts + backend + HTTP flow. No
  # credentials needed (IPFS/inference fall back to mock/local).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts + SDK
        run: npm run contracts:build && npm run sdk:build

      - name: End-to-end local run
        run: npm run e2e:local

  # Rehearses the real (mainnet) deploy path against a read-only Base fork.
  # Non-blocking: depends on a public mainnet RPC.
  fork-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run contracts:build

      - name: Rehearse mainnet deploy on a Base fork (no funds)
        run: npm run rehearse:mainnet-fork

  # Scans the FULL git history for secrets (scan-secrets only covers the working
  # tree). Pinned + checksum-verified gitleaks.
  secrets-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (v8.30.1, checksum-verified)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xf /tmp/gitleaks.tar.gz -C /tmp

      - name: Scan full history for secrets
        run: /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  # Fails a PR that introduces a high-severity dependency.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build demo/backend image
        run: docker build -t taop-demo:ci .

      - name: Verify image artifacts (no chain/keys needed)
        run: |
          docker run --rm --entrypoint sh taop-demo:ci -c '
            test "$(id -u)" = "1000" &&
            node --version &&
            node --check packages/backend/dist/server.cjs &&
            test -f apps/demo/dist/index.html &&
            test -f deployments.json
          '

      - name: Container smoke test (boots read-only, answers /api/healthz)
        run: |
          # Read-only needs no private keys: this boot proves keys are optional.
          docker run -d --name taop-smoke -p 4000:4000 \
            -e TAOP_API_KEY=smoke-test-key \
            -e DEMO_READ_ONLY=true \
            -e BASE_SEPOLIA_RPC_URL=https://sepolia.base.org \
            taop-demo:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs taop-smoke | tail -20
          docker rm -f taop-smoke >/dev/null
          [ "$ok" = "1" ]

  # Deterministic gaming-resistance benchmark: rubric + determinism tests, and a
  # reproducibility check against the committed seed-42 baseline. Fails if the
  # published numbers drift unintentionally.
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Benchmark tests (rubric, determinism, seed-42 baseline)
        run: npm run benchmark:test
