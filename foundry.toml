[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
cache_path = "cache_forge"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Property tests: keep runs modest so CI stays fast, but meaningful.
[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false
