[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taop"
version = "0.1.0"
description = "TAOP — Trustless Agent Orchestration Protocol Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=6.0,<8.0",
    "eth-account>=0.10,<0.14",
    "eth-utils>=2.0,<6.0",
]
# Publish: pip install build twine; python -m build; twine upload dist/*

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["taop*"]

# taop/abis.py loads these at import time — they MUST ship in the wheel.
[tool.setuptools.package-data]
taop = ["ron_abi.json", "reg_abi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits a live RPC / deployment (deselect with -m 'not network')",
]
