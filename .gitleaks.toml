# gitleaks config — scan git history for secrets, with a narrow allowlist for
# values that are intentionally public (documented placeholders and Hardhat's
# well-known, always-funded dev keys).
[extend]
useDefault = true

[allowlist]
description = "Public placeholders / Hardhat dev keys / generated reports"
regexes = [
  # placeholder used in docs + the auth-matrix curl examples
  '''test-key-abc123''',
  # Hardhat's default accounts (public test keys, funded on local nodes)
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''test test test test test test test test test test test junk''',
]
paths = ['''coverage\.json''']
